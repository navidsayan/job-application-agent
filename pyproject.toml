[project]
name = "job-application-agent"
version = "0.1.0"
description = "Human-in-the-loop job discovery and application preparation agent"
requires-python = ">=3.11"
dependencies = [
	"pypdf>=5.0",
	"python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[project.scripts]
job-agent = "job_agent.cli:main"
job-agent-web = "job_agent.web:main"

[tool.pytest.ini_options]
pythonpath = ["."]
